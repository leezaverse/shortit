<input type="text" placeholder="Enter long url" id="input" />
<button id="gen">Generate</button>
<div id="output"></div>

<script>
    function generate() {
        const longUrlPtr = document.getElementById("input");
        const longUrlValue = longUrlPtr.value.trim();
        const divPtr = document.getElementById("output");

        try {
            const url = new URL(longUrlValue);
            if (!['http:', 'https:'].includes(url.protocol)) {
                throw new Error();
            }
        } catch (error) {
            divPtr.innerHTML = "Please enter a valid URL.";
            return;
        }

        const myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        const raw = JSON.stringify({
            "longUrl": longUrlValue
        });

        const requestOptions = {
            method: "POST",
            headers: myHeaders,
            body: raw,
            redirect: "follow"
        };

        fetch("http://localhost:2005/shortenUrl", requestOptions)
            .then((response) => response.json())
            .then((result) =>{ 
                console.log(result)
                const shortUrl = `${window.location.origin}/${result["shortKey"]}`;
                divPtr.innerHTML = `Short URL: <a href="${shortUrl}" target="_blank" rel="noopener noreferrer">${shortUrl}</a>`;
            })
            .catch((error) => console.error(error));
    }

    const genPtr = document.getElementById("gen");
    genPtr.addEventListener('click', generate);
</script>
