<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortit - URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 mb-2">Shorten your URL</h1>
                        <p class="text-secondary mb-4">Create a shorter link that is easy to share.</p>

                        <label class="form-label" for="input">Long URL</label>
                        <div class="input-group mb-3">
                            <input type="url" class="form-control" placeholder="https://example.com" id="input" />
                            <button class="btn btn-primary" type="button" id="gen">Generate</button>
                        </div>
                        <div id="output" class="alert d-none mb-0" role="alert"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script>
    function isValidUrl(value) {
        try {
            const url = new URL(value);
            return ['http:', 'https:'].includes(url.protocol);
        } catch (error) {
            return false;
        }
    }

    function showMessage(message) {
        const output = document.getElementById("output");
        output.className = "alert alert-danger mb-0";
        output.textContent = message;
    }

    function showShortUrl(shortKey) {
        const shortUrl = `${window.location.origin}/${shortKey}`;
        const output = document.getElementById("output");
        const link = document.createElement("a");

        link.href = shortUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = shortUrl;

        output.className = "alert alert-success mb-0";
        output.textContent = "Short URL: ";
        output.appendChild(link);
    }

    function shortenUrl(longUrl) {
        const requestOptions = {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                "longUrl": longUrl
            })
        };

        return fetch("/shortenUrl", requestOptions)
            .then((response) => response.json().then((result) => {
                if (!response.ok) {
                    throw new Error(result["error"] || "Unable to shorten URL.");
                }
                return result;
            }));
    }

    function generate() {
        const longUrlValue = document.getElementById("input").value.trim();

        if (!isValidUrl(longUrlValue)) {
            showMessage("Please enter a valid URL.");
            return;
        }

        shortenUrl(longUrlValue)
            .then((result) => showShortUrl(result["shortKey"]))
            .catch((error) => {
                console.error(error);
                showMessage(error.message);
            });
    }

    const genPtr = document.getElementById("gen");
    genPtr.addEventListener('click', generate);
</script>
